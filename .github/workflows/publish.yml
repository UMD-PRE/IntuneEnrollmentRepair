name: Publish to PSGallery

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to PSGallery
        shell: pwsh
        run: Publish-Module -Path . -NuGetApiKey $env:NUGET_API_KEY
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
